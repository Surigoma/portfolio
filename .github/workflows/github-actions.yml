name: Build CI
run-name: Build and release site data.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 10.14.0
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Generate info
        run: pnpm run gen_info
      - name: Build
        run: pnpm build
      - name: Archive Production Build
        run: tar -czf release.tar.gz --directory=./dist ./
      - name: Create Release
        run: |
          gh release create ${{github.ref_name}} --generate-notes release.tar.gz
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
