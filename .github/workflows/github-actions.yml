name: Build CI
run-name: Build and release site data.
on:
  push:
    tags:
      - "v*"
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.14.0
      - name: Install dependencies
        run: pnpm i --frozen-lockfile
      - name: Generate info
        run: pnpm run gen_info
      - name: Build
        run: pnpm build
      - name: Archive Production Build
        run: tar -czf release.tar.gz --directory=./dist ./
      - name: Create Release
        run: |
          gh release create ${{github.ref_name}} --generate-notes release.tar.gz
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
